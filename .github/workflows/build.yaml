name: Build and Test
on:
  workflow_dispatch:
  workflow_call:
jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@v6
      - name: Set up Go
        # https://github.com/actions/setup-go
        uses: actions/setup-go@v6
      - name: Run Go Fmt
        run: go fmt ./...
      - name: Run Go Vet
        run: go vet ./...
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v ./...